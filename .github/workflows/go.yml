name: Go
on: [push, pull_request]
jobs:

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: true

    - name: Install gotip
      run: |
        go install golang.org/dl/gotip@latest
        GOTIP_ROOT=$("$(go env GOPATH)/bin/gotip" env GOROOT)
        echo "GOROOT=$GOTIP_ROOT" >> "$GITHUB_ENV"
        echo "$GOTIP_ROOT/bin" >> "$GITHUB_PATH"

    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.OS }}-build-

    - name: Vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet -v ./...

    - name: Build
      env:
        CGO_ENABLED: 0
      run: go build -ldflags "-s -w" ./...

    - name: Test
      run: go test -v -race ./...

    - name: Vet (safe)
      if: matrix.os == 'ubuntu-latest'
      run: go vet -tags boltron_safe -v ./...

    - name: Build (safe)
      env:
        CGO_ENABLED: 0
      run: go build -tags boltron_safe -ldflags "-s -w" ./...

    - name: Test (safe)
      run: go test -tags boltron_safe -v -race ./...
