name: Go
on: [push, pull_request]
jobs:

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:

    # Bootstrap a stable Go version needed to compile gotip
    - name: Set up Stable Go (Bootstrap)
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: false # Disable default caching to prevent stable cache overrides

    # Install, download, and link gotip to completely replace go
    - name: Install and Replace Go with GoTip
      run: |
        # Install the gotip downloader tool
        go install golang.org/dl/gotip@latest

        # Run the downloader to fetch and compile the latest Go development source
        gotip download

        # Locate the compiled gotip SDK directory (usually ~/sdk/gotip)
        GOTIP_BIN="$HOME/sdk/gotip/bin"

        # Prepend the gotip binary directory directly to the GitHub Actions PATH environment
        echo "$GOTIP_BIN" >> $GITHUB_PATH

    # Verify that the 'go' command maps directly to the development version
    - name: Verify Go Version
      run: go version


    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.OS }}-build-

    - name: Vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet -v ./...

    - name: Build
      env:
        CGO_ENABLED: 0
      run: go build -ldflags "-s -w" ./...

    - name: Test
      run: go test -v -race ./...

    - name: Vet (safe)
      if: matrix.os == 'ubuntu-latest'
      run: go vet -tags boltron_safe -v ./...

    - name: Build (safe)
      env:
        CGO_ENABLED: 0
      run: go build -tags boltron_safe -ldflags "-s -w" ./...

    - name: Test (safe)
      run: go test -tags boltron_safe -v -race ./...
