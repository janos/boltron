name: Go
on: [push, pull_request]
jobs:

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Set up Stable Go (Bootstrap)
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: false

    - name: Install and Replace Go with GoTip (Linux/macOS)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        go install golang.org/dl/gotip@latest
        gotip download
        echo "$HOME/sdk/gotip/bin" >> $GITHUB_PATH

    - name: Install and Replace Go with GoTip (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        go install golang.org/dl/gotip@latest
        gotip download
        Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append -InputObject "$env:USERPROFILE\sdk\gotip\bin"

    - name: Verify Go Version
      run: go version

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.OS }}-build-

    - name: Vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet -v ./...

    - name: Build
      env:
        CGO_ENABLED: 0
      run: go build -ldflags "-s -w" ./...

    - name: Test
      run: go test -v -race ./...

    - name: Vet (safe)
      if: matrix.os == 'ubuntu-latest'
      run: go vet -tags boltron_safe -v ./...

    - name: Build (safe)
      env:
        CGO_ENABLED: 0
      run: go build -tags boltron_safe -ldflags "-s -w" ./...

    - name: Test (safe)
      run: go test -tags boltron_safe -v -race ./...
